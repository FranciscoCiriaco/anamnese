<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Fichas de Anamnese</title>
</head>
<body>
<h1>Lista de Fichas de Anamnese</h1>

<table border="1">
    <thead>
    <tr>
        <th>Paciente</th>
        <th>Sexo</th>
        <th>Contato</th>
        <th>Ações</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="ficha : ${fichas}">
        <td th:text="${ficha.id}"></td>

        <td th:if="${ficha.paciente != null}" th:text="${ficha.paciente.nome}">Paciente</td>
        <td th:unless="${ficha.paciente != null}">Paciente não associado</td>

        <td>
            <a th:if="${ficha.paciente != null}"
               th:href="@{/fichas/{id}/editar(id=${ficha.id})}">Editar</a>
            <span th:unless="${ficha.paciente != null}">---</span>
        </td>
    </tr>
    </tbody>
</table>

<br>
<a href="/fichas/nova">Nova Ficha</a>
<a href="/paciente">Voltar</a>
</body>
</html>
