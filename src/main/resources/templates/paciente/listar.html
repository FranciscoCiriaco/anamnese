<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Lista de Pacientes</title>
</head>
<body>
<h1>Lista de Pacientes</h1>
<a href="/pacientes/novo">Novo Paciente</a>
<table>
    <thead>
    <tr>
        <th>Nome</th>
        <th>Email</th>
        <th>Ações</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="paciente : ${pacientes}">
        <td th:text="${paciente.nome}"></td>
        <td th:text="${paciente.email}"></td>
        <td>
            <a th:href="@{/pacientes/{id}(id=${paciente.id})}">Visualizar</a>
            <a th:href="@{/pacientes/{id}/editar(id=${paciente.id})}">Editar</a>
            <form th:action="@{/pacientes/{id}/remover(id=${paciente.id})}" method="post" style="display:inline;">
                <button type="submit">Remover</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
